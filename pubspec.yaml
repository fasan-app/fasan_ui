name: fasan_ui
description: Gemeinsames Designpaket der Fasan-Apps – Tokens, Stile, Filmeffekte, Bewegung, Bausteine, Haptik, Akku-Stufen.
version: 0.1.0
repository: https://github.com/fasan-app/fasan_ui
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  # Flutter team, BSD-3-Clause: shared axis, fade through, container transform
  animations: ^3.0.0
  # BSD-2-Clause, Vibrator service on Android (needs the VIBRATE permission in the app manifest; pub.dev/packages/vibration)
  vibration: ^3.1.3
  # MIT, short own tones for taps (BytesSource in MediaPlayer mode; pub.dev/packages/audioplayers)
  audioplayers: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: app.fasan.ui
        pluginClass: FasanUiPlugin
  shaders:
    - shaders/grain.frag
    - shaders/glass.frag
  fonts:
    # SIL Open Font License 1.1 (fonts/OFL-*.txt)
    - family: FasanInter
      fonts:
        - asset: fonts/Inter-400.ttf
          weight: 400
        - asset: fonts/Inter-500.ttf
          weight: 500
        - asset: fonts/Inter-600.ttf
          weight: 600
        - asset: fonts/Inter-700.ttf
          weight: 700
    - family: FasanGeist
      fonts:
        - asset: fonts/Geist-Regular.ttf
          weight: 400
        - asset: fonts/Geist-Medium.ttf
          weight: 500
        - asset: fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: fonts/Geist-Bold.ttf
          weight: 700
    - family: FasanGeistMono
      fonts:
        - asset: fonts/GeistMono-Regular.ttf
